# 留言板 Worker 配置（本地 wrangler 部署用；
# 沙箱内实际通过 Cloudflare API 上传，metadata 与这里保持一致）
name = "guestbook-api"
main = "index.js"
compatibility_date = "2026-09-01"

# D1 绑定：环境变量 DB -> guestbook 数据库
[[d1_databases]]
binding = "DB"
database_name = "guestbook"
database_id = "c627ee4b-07cb-450b-90cb-864537e193bb"

# ADMIN_KEY 走 secret（wrangler secret put ADMIN_KEY），不进仓库
# 触发 routes 的自定义域在 Dashboard 中绑定：api.hconzlvra.top

[observability]
enabled = true
