name: Deploy Astro site to Pages

on: push

permissions:
  contents: read
  pages: write
  id-token: write

# 串行化 Pages 部署（官方模板推荐写法）：连续快速 push 时排队执行而不是并发
# 调 Pages 部署 API，避免瞬时冲突导致的 "id-token: write" 假错误
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
