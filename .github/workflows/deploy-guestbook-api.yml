name: Deploy Guestbook API to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'pages_dist/**'
      - '.github/workflows/deploy-guestbook-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx wrangler@4 pages deploy pages_dist --project-name=guestbook --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
